# The suite needs no network, no database and no services. It DOES now need an install: the accessibility
# gate uses axe-core in jsdom, which are devDependencies. The RUNTIME dependency count is still zero — the app
# runs from a clone with no install, the Dockerfile installs nothing — and that is the rule this file used to
# state more broadly than it meant. A service container here would still be a sign something had gone wrong.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.14 is what the Dockerfile pins, so a green build there is the one that matters. 24 is included to
        # notice a breaking change in node:sqlite BEFORE the LTS line moves under us — the module is young.
        node: ["22.14", "24"]
    steps:
      # v7 on both — current, and the reason to leave v4 was the RUNTIME: v4 declares `using: node20`, which the
      # runners no longer offer. They force it onto node24 and announce it as deprecated on every run. Read out of
      # each action.yml rather than assumed: v4 is node20, v5/v6/v7 are all node24. Needs a runner at v2.327.1 or
      # newer, which GitHub-hosted ubuntu-latest is.
      #
      # What the majors after v4 change that could touch this workflow, checked rather than skimmed:
      #   checkout    v6 moves credentials to a separate file; v7 blocks checking out a FORK PR under
      #               `pull_request_target` and `workflow_run`. This workflow triggers on `push` and
      #               `pull_request`, so that restriction does not reach it.
      #   setup-node  v5 added automatic caching when package.json carries a `packageManager` field, and v6
      #               narrowed that to npm only. This package.json has no such field, so it is off either way.
      #               v7 adds cache outputs and drops a dummy NODE_AUTH_TOKEN export; nothing here publishes.
      - uses: actions/checkout@v7
        with:
          # Full history AND tags. Two checks need them and neither could ever have passed here: tools/proseproof.mjs
          # runs the suite in a worktree (its step comment already said "no shallow checkout" — a stated requirement
          # nothing implemented), and rollover.test.mjs asserts at least one tag exists, precisely so the version-vs-tag
          # check above it cannot go vacuous. checkout defaults to depth 1 with no tags — unchanged through v7, so this
          # line is still load-bearing — and that guard fired on every run without it: `git tag -l` was empty and the
          # test correctly said the check it protects was proving nothing.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Show what we are running on
        run: node --version
      - name: Install the test-only packages
        # Only axe-core and jsdom, and only for the suite. Nothing here reaches the image or a deployment.
        run: npm ci
      - name: Run the suite
        # `npm test`, not `node --test`, and the difference is the point: npm test runs tools/precheck.mjs first and
        # this step used to skip it. Precheck exists because ONE unterminated template literal left a quarter of the
        # test files unrun with the process not terminating — the suite did not go red, it went unreliable, which is
        # the single failure mode a gate must not have. So the gate was running the weaker of the two available
        # commands, and only because nobody had compared them.
        #
        # The failure is also echoed into an ANNOTATION, because reading the log needs a signed-in session with
        # admin rights on the repo and reading an annotation does not. This workflow has NEVER passed — six runs,
        # six failures — while README.md said CI "has never run: this repository has no remote yet". It had a
        # remote and it had run; the failure was unreadable without signing in, so nobody looked.
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # The FAILING lines first, then a short tail. A tail alone is the wrong lines — the runner prints one
            # line per passing test, so the end of the output is whatever ran last — and GitHub truncates a long
            # annotation mid-word, which ate the summary on the Node 24 job. Node prints TAP ("not ok N - name")
            # when piped and the spec reporter ("✖ name") otherwise, so both markers are matched.
            { grep -aA5 -E 'not ok [0-9]|✖ ' /tmp/test-output.txt | grep -avE '^\s*(duration_ms|\.\.\.|ok [0-9])' | head -45
              echo "-- counts --"
              grep -aE '^# (tests|pass|fail|cancelled)|^ℹ (tests|pass|fail|cancelled)' /tmp/test-output.txt | head -8
            } > /tmp/test-report.txt
            body=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' /tmp/test-report.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Suite failed on Node ${{ matrix.node }} (exit $code)::$body"
          fi
          exit $code
      - name: No check in the suite may be satisfied by a comment
        # tools/proseproof.mjs strips every comment — JS, YAML, and config/pattern.json's _comment — in a throwaway
        # worktree, then runs the suite. A check whose needle lived in prose loses it and fails. This class has cost
        # about a dozen defects here, the most recent being a CI assertion satisfied by the comment explaining the
        # change it was supposed to be checking. It plants its own control on every run and refuses to report a clean
        # result if that control does not fail. Needs the git history, so no shallow checkout.
        if: matrix.node == '22.14'
        run: |
          set +e
          { node tools/proseproof.mjs ; } 2>&1 | tee /tmp/step.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            body=$(tail -30 /tmp/step.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=proseproof failed (exit $code)::$body"
          fi
          exit $code
      - name: No assertion in the suite may be one that never runs
        # tools/deadassert.mjs reads the raw V8 coverage and reports every assert() call site that never executed.
        # Its first run found five, four of them real — a horizon check looping over an empty list, a boundary case
        # behind an always-false guard, a clash the fixture could not express. A green suite says nothing about those,
        # so a green CI should not either. Once, on the version the Dockerfile pins: it re-runs the whole suite under
        # coverage, and the answer does not differ by Node line.
        if: matrix.node == '22.14'
        run: |
          set +e
          { node tools/deadassert.mjs ; } 2>&1 | tee /tmp/step.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            body=$(tail -30 /tmp/step.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=deadassert failed (exit $code)::$body"
          fi
          exit $code
      - name: Prove a fresh deployment comes up and seeds itself
        # The bug this catches is the one that shipped: migrate ran, seeding did not, and the app served a
        # working-looking empty shell. Every test builds its world through the harness, so only the real entry
        # point can prove this.
        run: |
          FOURWATER_SECRET=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n') \
          FOURWATER_DB=/tmp/ci.db PORT=8099 node src/server.mjs &
          for i in $(seq 1 40); do
            sleep 0.25
            if curl -fsS http://127.0.0.1:8099/healthz > /dev/null; then break; fi
          done
          curl -fsS http://127.0.0.1:8099/healthz
          node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync('/tmp/ci.db', { readOnly: true });
            const n = db.prepare('SELECT COUNT(*) n FROM sessions').get().n;
            if (n === 0) { console.error('a fresh deployment seeded no sessions'); process.exit(1); }
            console.log('fresh deployment has', n, 'sessions');
          "
      - name: Prove a backup restores into a working database
        run: |
          FOURWATER_DB=/tmp/ci.db FOURWATER_BACKUP_DIR=/tmp/ci-backups node tools/backup.mjs --no-upload
          node -e "
            const { readdirSync } = require('node:fs');
            const f = readdirSync('/tmp/ci-backups').filter(x => x.endsWith('.sqlite')).sort().pop();
            import('./tools/backup.mjs').then(m => {
              const v = m.verifyBackup('/tmp/ci-backups/' + f);
              if (!v.ok) { console.error('backup failed integrity_check', v); process.exit(1); }
              console.log('restored backup is sound:', JSON.stringify(v.counts));
            });
          "
